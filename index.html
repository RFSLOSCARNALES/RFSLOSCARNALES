<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Rifa - 1,250 Boletos (Firebase Sync)</title>
  <style>
    :root {
      --primary: #0d6efd;
      --success: #198754;
      --warning: #ffc107;
      --danger: #dc3545;
      --bg: #f8f9fa;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); margin: 0; padding: 15px; color: #212529; }
    .container { max-width: 1200px; margin: 0 auto; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 20px; }
    .stat-card { background: #fff; padding: 12px; border-radius: 8px; text-align: center; border: 1px solid #ccc; }
    .stat-card h3 { margin: 5px 0 0 0; font-size: 1.5rem; }
    .controls { background: #fff; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #ccc; display: flex; gap: 10px; flex-wrap: wrap; }
    .controls input, .controls select, .controls button { padding: 8px 12px; border: 1px solid #ccc; border-radius: 5px; font-size: 0.95rem; }
    .controls input { flex: 1; min-width: 200px; }
    .btn { cursor: pointer; border: none; font-weight: bold; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-success { background: var(--success); color: white; }
    .btn-danger { background: var(--danger); color: white; }
    .btn-secondary { background: #6c757d; color: white; }
    .ticket-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; max-height: 500px; overflow-y: auto; background: #fff; padding: 10px; border-radius: 8px; border: 1px solid #ccc; }
    .ticket-card { border: 2px solid #dee2e6; border-radius: 6px; padding: 8px; text-align: center; cursor: pointer; background: #fff; user-select: none; }
    .ticket-card.free { border-color: var(--success); background: #f8fff9; }
    .ticket-card.reserved { border-color: var(--warning); background: #fffdf0; }
    .ticket-card.paid { border-color: var(--danger); background: #fff8f8; }
    .ticket-card.selected { border-color: var(--primary) !important; background: #e7f1ff !important; box-shadow: 0 0 0 2px var(--primary); }
    .number-tag { font-size: 0.7rem; background: #e9ecef; border-radius: 3px; padding: 1px 3px; margin: 1px; display: inline-block; }
    .bulk-bar { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); background: #212529; color: white; padding: 12px 20px; border-radius: 30px; display: flex; gap: 15px; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.3); z-index: 1000; }
    .hidden { display: none !important; }
    .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; z-index: 2000; }
    .modal-content { background: white; padding: 20px; border-radius: 8px; width: 90%; max-width: 400px; }
    .modal-content input, .modal-content select { width: 100%; margin-bottom: 10px; padding: 8px; }
    .sync-status { font-size: 0.8rem; padding: 4px 8px; border-radius: 4px; background: #e2e3e5; color: #383d41; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h2>Control de Rifa (1,250 Boletos)</h2>
    <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
      <span id="syncStatus" class="sync-status">Conectando a Firebase...</span>
      <button class="btn btn-secondary" onclick="forceGenerate()">⚡ Inicializar Boletos</button>
      <button class="btn btn-danger" onclick="resetData()">🗑️ Borrar Datos</button>
    </div>
  </div>

  <div class="stats-grid">
    <div class="stat-card" style="border-color: var(--success);"><small>Disponibles</small><h3 id="statFree">0</h3></div>
    <div class="stat-card" style="border-color: var(--warning);"><small>Apartados</small><h3 id="statReserved">0</h3></div>
    <div class="stat-card" style="border-color: var(--danger);"><small>Pagados</small><h3 id="statPaid">0</h3></div>
    <div class="stat-card" style="border-color: var(--primary);"><small>Seleccionados</small><h3 id="statSelected">0</h3></div>
  </div>

  <div class="controls">
    <input type="text" id="searchInput" placeholder="Buscar # Boleto, Comprador o Oportunidad (0000-9999)..." oninput="renderGrid()">
    <select id="filterStatus" onchange="renderGrid()">
      <option value="all">Todos los estados</option>
      <option value="free">Solo Disponibles</option>
      <option value="reserved">Solo Apartados</option>
      <option value="paid">Solo Pagados</option>
    </select>
    <button class="btn btn-primary" onclick="selectAllVisible()">Seleccionar Visibles</button>
    <button class="btn btn-secondary" onclick="selectRandomFree()">🎲 Selección Azar</button>
    <button class="btn btn-secondary" onclick="clearSelection()">Limpiar Selección</button>
    <button class="btn btn-success" onclick="downloadReportCSV()">📥 Descargar Reporte CSV</button>
    <button class="btn btn-primary" style="background:#6f42c1;" onclick="openSorteoModal()">🏆 Sorteo</button>
  </div>

  <div class="ticket-grid" id="ticketGrid">Cargando datos desde Firebase...</div>
</div>

<div id="bulkBar" class="bulk-bar hidden">
  <span id="selectedCountText">0 seleccionados</span>
  <button class="btn btn-primary" onclick="openBulkModal()">Asignar Comprador</button>
  <button class="btn btn-secondary" onclick="clearSelection()">Cancelar</button>
</div>

<div id="ticketModal" class="modal hidden">
  <div class="modal-content">
    <h3 id="modalTitle">Asignar Datos</h3>
    <p id="modalSubtext" style="font-size:0.8rem; color:#6c757d;"></p>
    <label>Nombre del Comprador:</label>
    <input type="text" id="buyerName" placeholder="Ej. Juan Pérez">
    <label>Teléfono / WhatsApp:</label>
    <input type="text" id="buyerPhone" placeholder="Ej. 5512345678">
    <label>Estado del Boleto:</label>
    <select id="ticketStatus">
      <option value="reserved">Apartado</option>
      <option value="paid">Pagado</option>
      <option value="free">Disponible (Liberar)</option>
    </select>
    <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:10px;">
      <button class="btn btn-secondary" onclick="closeModal('ticketModal')">Cancelar</button>
      <button class="btn btn-primary" onclick="saveTicketData()">Guardar en Firebase</button>
    </div>
  </div>
</div>

<div id="sorteoModal" class="modal hidden">
  <div class="modal-content" style="text-align:center;">
    <h3>🏆 Realizar Sorteo</h3>
    <p>Ingresa el número ganador de 4 dígitos (0000-9999):</p>
    <input type="text" id="winningNumberInput" maxlength="4" placeholder="0000" style="font-size:1.5rem; text-align:center;">
    <button class="btn btn-primary" onclick="evaluateWinner()" style="width:100%; margin-top:10px;">Buscar Ganador</button>
    <div id="winnerResult" style="margin-top:15px;"></div>
    <button class="btn btn-secondary" onclick="closeModal('sorteoModal')" style="margin-top:10px;">Cerrar</button>
  </div>
</div>

<!-- SDK MÓDULOS DE FIREBASE -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, set, update, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  // 1. REEMPLAZA ESTE BLOQUE CON TUS CLAVES REALES DE FIREBASE:
  const firebaseConfig = {
  apiKey: "AIzaSyDbk5JeczE4sy98d7NyWNzQWQC9t1ZI3ko",
  authDomain: "rifa1250.firebaseapp.com",
  databaseURL: "https://rifa1250-default-rtdb.firebaseio.com",
  projectId: "rifa1250",
  storageBucket: "rifa1250.firebasestorage.app",
  messagingSenderId: "99202079233",
  appId: "1:99202079233:web:c054b3bd6149e4c3633e00",
  measurementId: "G-CRD9B9VSX9"
};


  const ADMIN_PASSWORD = "RFSLC123";

  // Inicializar Firebase
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const ticketsRef = ref(db, 'boletos');

  const TOTAL_TICKETS = 1250;
  let tickets = {};
  let selectedTickets = new Set();

  // Escuchar cambios en tiempo real desde Firebase
  onValue(ticketsRef, (snapshot) => {
    const data = snapshot.val();
    const statusLabel = document.getElementById('syncStatus');

    if (data) {
      tickets = data;
      statusLabel.innerText = "🟢 Sincronizado en Vivo";
      statusLabel.style.background = "#d1e7dd";
      statusLabel.style.color = "#0f5132";
    } else {
      tickets = {};
      statusLabel.innerText = "⚠️ Base de datos vacía";
      statusLabel.style.background = "#fff3cd";
      statusLabel.style.color = "#664d03";
    }
    renderGrid();
  }, (error) => {
    console.error(error);
    const statusLabel = document.getElementById('syncStatus');
    statusLabel.innerText = "🔴 Error de conexión";
    statusLabel.style.background = "#f8d7da";
    statusLabel.style.color = "#842029";
  });

  // Función para validar contraseña de administrador
  function checkPassword() {
    const pwd = prompt("Ingresa la contraseña de administrador:");
    if (pwd === ADMIN_PASSWORD) {
      return true;
    } else {
      if (pwd !== null) alert("Contraseña incorrecta.");
      return false;
    }
  }

  // Generar todos los boletos con contraseña
  window.forceGenerate = function() {
    if (!checkPassword()) return;
    if (!confirm('¿Deseas reiniciar y generar los 1,250 boletos en Firebase?')) return;
    
    const newTickets = {};
    for (let i = 1; i <= TOTAL_TICKETS; i++) {
      const opps = [];
      for (let j = 0; j < 8; j++) {
        let num = (i - 1) + (j * TOTAL_TICKETS);
        opps.push(num.toString().padStart(4, '0'));
      }
      newTickets[i] = { id: i, status: 'free', buyer: '', phone: '', numbers: opps };
    }

    set(ticketsRef, newTickets)
      .then(() => alert('1,250 Boletos inicializados con éxito en Firebase.'))
      .catch((err) => alert('Error al guardar: ' + err.message));
  };

  // Borrar datos con contraseña
  window.resetData = function() {
    if (!checkPassword()) return;
    if (confirm('¿Deseas BORRAR TODOS los datos de Firebase?')) {
      remove(ticketsRef)
        .then(() => {
          selectedTickets.clear();
          alert('Datos eliminados de la nube.');
        })
        .catch(err => alert("Error: " + err.message));
    }
  };

  // Seleccionar boletos aleatoriamente entre los disponibles
  window.selectRandomFree = function() {
    const freeTickets = Object.values(tickets).filter(t => t.status === 'free');
    if (freeTickets.length === 0) {
      alert("No hay boletos disponibles para seleccionar.");
      return;
    }

    const qtyStr = prompt(`Hay ${freeTickets.length} boletos disponibles. ¿Cuántos deseas seleccionar al azar?`, "1");
    if (!qtyStr) return;
    
    const qty = parseInt(qtyStr, 10);
    if (isNaN(qty) || qty <= 0) {
      alert("Ingresa un número válido.");
      return;
    }

    if (qty > freeTickets.length) {
      alert(`Solo hay ${freeTickets.length} boletos disponibles.`);
      return;
    }

    // Mezclar lista de disponibles al azar
    const shuffled = [...freeTickets].sort(() => 0.5 - Math.random());
    const selected = shuffled.slice(0, qty);

    selectedTickets.clear();
    selected.forEach(t => selectedTickets.add(t.id));
    renderGrid();
  };

  // Descargar reporte completo en formato CSV
  window.downloadReportCSV = function() {
    const list = Object.values(tickets);
    if (list.length === 0) {
      alert("No hay datos cargados para exportar.");
      return;
    }

    let csvContent = "\uFEFF"; // BOM para caracteres especiales UTF-8 en Excel
    csvContent += "Boleto ID,Estado,Comprador,Telefono,Oportunidades (8 Numeros)\n";

    list.forEach(t => {
      const statusText = t.status === 'free' ? 'Disponible' : (t.status === 'reserved' ? 'Apartado' : 'Pagado');
      const buyerText = t.buyer ? `"${t.buyer.replace(/"/g, '""')}"` : '""';
      const phoneText = t.phone ? `"${t.phone.replace(/"/g, '""')}"` : '""';
      const numbersText = t.numbers ? `"${t.numbers.join(' - ')}"` : '""';

      csvContent += `${t.id},${statusText},${buyerText},${phoneText},${numbersText}\n`;
    });

    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.setAttribute("href", url);
    link.setAttribute("download", `Reporte_Rifa_1250_${new Date().toISOString().slice(0,10)}.csv`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  };

  // Guardar modificaciones masivas en Firebase
  window.saveTicketData = function() {
    const name = document.getElementById('buyerName').value.trim();
    const phone = document.getElementById('buyerPhone').value.trim();
    const status = document.getElementById('ticketStatus').value;

    const updates = {};
    selectedTickets.forEach(id => {
      updates[`boletos/${id}/status`] = status;
      updates[`boletos/${id}/buyer`] = status === 'free' ? '' : name;
      updates[`boletos/${id}/phone`] = status === 'free' ? '' : phone;
    });

    update(ref(db), updates)
      .then(() => {
        clearSelection();
        closeModal('ticketModal');
      })
      .catch(err => alert("Error al actualizar: " + err.message));
  };

  // Funciones de renderizado y UI
  window.renderGrid = function() {
    const grid = document.getElementById('ticketGrid');
    const search = document.getElementById('searchInput').value.trim().toLowerCase();
    const filterStatus = document.getElementById('filterStatus').value;
    grid.innerHTML = '';

    const list = Object.values(tickets);
    if (list.length === 0) {
      grid.innerHTML = '<div>No hay boletos en Firebase. Haz clic en "⚡ Inicializar Boletos".</div>';
      updateStats();
      return;
    }

    list.forEach(t => {
      if (filterStatus !== 'all' && t.status !== filterStatus) return;

      const matches = search === '' ||
        t.id.toString().includes(search) ||
        (t.buyer && t.buyer.toLowerCase().includes(search)) ||
        (t.numbers && t.numbers.some(n => n.includes(search)));

      if (!matches) return;

      const isSel = selectedTickets.has(t.id);
      const card = document.createElement('div');
      card.className = `ticket-card ${t.status} ${isSel ? 'selected' : ''}`;
      card.onclick = () => toggleSelectTicket(t.id);

      let statusLabel = t.status === 'free' ? 'Disponible' : (t.status === 'reserved' ? 'Apartado' : 'Pagado');

      card.innerHTML = `
        <strong>#${t.id}</strong><br>
        <small style="font-size:0.7rem;">${statusLabel}</small><br>
        <small style="display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${t.buyer || '---'}</small>
        <div><span class="number-tag">${t.numbers ? t.numbers[0] : ''}</span> <span class="number-tag">+7</span></div>
      `;
      grid.appendChild(card);
    });
    updateStats();
  };

  function updateStats() {
    let free = 0, reserved = 0, paid = 0;
    Object.values(tickets).forEach(t => {
      if (t.status === 'free') free++;
      else if (t.status === 'reserved') reserved++;
      else if (t.status === 'paid') paid++;
    });
    document.getElementById('statFree').innerText = free;
    document.getElementById('statReserved').innerText = reserved;
    document.getElementById('statPaid').innerText = paid;
    document.getElementById('statSelected').innerText = selectedTickets.size;

    const bulkBar = document.getElementById('bulkBar');
    if (selectedTickets.size > 0) {
      bulkBar.classList.remove('hidden');
      document.getElementById('selectedCountText').innerText = `${selectedTickets.size} boletos seleccionados`;
    } else {
      bulkBar.classList.add('hidden');
    }
  }

  window.toggleSelectTicket = function(id) {
    if (selectedTickets.has(id)) selectedTickets.delete(id);
    else selectedTickets.add(id);
    renderGrid();
  };

  window.selectAllVisible = function() {
    const search = document.getElementById('searchInput').value.trim().toLowerCase();
    const filterStatus = document.getElementById('filterStatus').value;

    Object.values(tickets).forEach(t => {
      if (filterStatus !== 'all' && t.status !== filterStatus) return;
      const matches = search === '' ||
        t.id.toString().includes(search) ||
        (t.buyer && t.buyer.toLowerCase().includes(search)) ||
        (t.numbers && t.numbers.some(n => n.includes(search)));
      if (matches) selectedTickets.add(t.id);
    });
    renderGrid();
  };

  window.clearSelection = function() {
    selectedTickets.clear();
    renderGrid();
  };

  window.openBulkModal = function() {
    if (selectedTickets.size === 0) return;
    document.getElementById('modalTitle').innerText = `Editar ${selectedTickets.size} Boletos`;
    document.getElementById('modalSubtext').innerText = `Boletos: ${Array.from(selectedTickets).slice(0, 8).join(', ')}...`;
    document.getElementById('buyerName').value = '';
    document.getElementById('buyerPhone').value = '';
    document.getElementById('ticketStatus').value = 'paid';
    document.getElementById('ticketModal').classList.remove('hidden');
  };

  window.closeModal = function(id) {
    document.getElementById(id).classList.add('hidden');
  };

  window.openSorteoModal = function() {
    document.getElementById('winnerResult').innerHTML = '';
    document.getElementById('winningNumberInput').value = '';
    document.getElementById('sorteoModal').classList.remove('hidden');
  };

  window.evaluateWinner = function() {
    const winNum = document.getElementById('winningNumberInput').value.trim().padStart(4, '0');
    let winner = null;

    Object.values(tickets).forEach(t => {
      if (t.numbers && t.numbers.includes(winNum)) winner = t;
    });

    const res = document.getElementById('winnerResult');
    if (winner) {
      res.innerHTML = `
        <div style="background:#d1e7dd; color:#0f5132; padding:10px; border-radius:5px;">
          <h4>¡Ganador Encontrado!</h4>
          <p>El número <strong>${winNum}</strong> es del <strong>Boleto #${winner.id}</strong></p>
          <p><strong>Comprador:</strong> ${winner.buyer || 'Sin asignar'}</p>
          <p><strong>Teléfono:</strong> ${winner.phone || 'N/A'}</p>
          <p><strong>Estado:</strong> ${winner.status.toUpperCase()}</p>
        </div>
      `;
    } else {
      res.innerHTML = `<div style="background:#f8d7da; color:#842029; padding:10px; border-radius:5px;">Número no encontrado.</div>`;
    }
  };
</script>
</body>
</html>
